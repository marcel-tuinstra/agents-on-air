name: Checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python build.py
      - run: python -m unittest discover -s tests -v
      - name: Frontend tests
        shell: bash
        run: |
          for test in tests/*.cjs; do node "$test" || exit 1; done
      - run: python package.py
      - name: Keep the release ZIP
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: agents-on-air
          path: ../agents-on-air.zip
          if-no-files-found: error
